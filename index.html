<!DOCTYPE html><html><head><title>My Expense Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:20px;background:#f0f0f0}.box{background:white;padding:20px;border-radius:12px}input,button{padding:12px;margin:6px 0;width:94%;font-size:16px}button{background:#2ecc71;color:white;border:none;border-radius:6px;font-weight:bold}.item{background:#f5f5f5;padding:10px;margin:8px 0;border-radius:6px;display:flex;justify-content:space-between}</style></head><body><div class="box"><h2>💰 My Expense Tracker</h2><input id="item" placeholder="Enti konnav?"><input id="price" type="number" placeholder="Enta?"><button onclick="addExpense()">Add Chey</button><h3>Total: Rs.<span id="total">0</span></h3><div id="list"></div></div><script>let expenses=JSON.parse(localStorage.getItem("myExpenses"))||[];showList();function addExpense(){let item=document.getElementById("item").value;let price=Number(document.getElementById("price").value);if(!item||!price)return alert("Details ivvu!");expenses.push({item,price});localStorage.setItem("myExpenses",JSON.stringify(expenses));document.getElementById("item").value="";document.getElementById("price").value="";showList();}function showList(){let list=document.getElementById("list");let total=0;list.innerHTML="";expenses.forEach(e=>{total+=e.price;list.innerHTML+=`<div class='item'><span>${e.item}</span><b>Rs.${e.price}</b></div>`});document.getElementById("total").innerText=total;}</script></body></html>
